    <title>Message API</title>
    <style>
      .observed-appear-active, .observed-enter-active { animation: message-enter .12s both; }
      .observed-leave-active { animation: message-leave .12s both; }
      @keyframes message-enter { from { opacity: 0; } to { opacity: 1; } }
      @keyframes message-leave { from { opacity: 1; } to { opacity: 0; } }
    </style>
  </head>

    <div id="target-one"></div>
